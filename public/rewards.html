<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewards and Incentives - RU Stable</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Inter:wght@400&family=Inria+Sans:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="menu-icon" id="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="logo-container">
                <a href="/" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit;">
                    <img alt="RU Stable Logo" class="logo-img" src="/assets/logo.png" />
                    <p class="logo-text">
                        <span class="logo-red">RU</span><span> Stable</span>
                    </p>
                </a>
            </div>
            <div class="menu-icon" style="visibility: hidden;">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>

        <!-- Side Menu -->
        <div class="side-menu" id="side-menu">
            <div class="side-menu-content">
                <a href="/budgeting.html" class="side-menu-item">
                    <span>Budget and spending</span>
                </a>
                <a href="/activity.html" class="side-menu-item">
                    <span>My activity</span>
                </a>
                <a href="/rewards.html" class="side-menu-item">
                    <span>Rewards and incentives</span>
                </a>
                <a href="/" class="side-menu-item">
                    <span>Home</span>
                </a>
            </div>
        </div>
        <div class="menu-overlay" id="menu-overlay"></div>

        <!-- Rewards Section -->
        <section class="content-section">
            <h2 class="section-title">Rewards and Incentives</h2>
            <div id="rewards-content" class="section-content">
                <div class="loading">Loading rewards data...</div>
            </div>
        </section>
    </div>
    <script>
        // Menu toggle functionality - ensure it works properly
        (function() {
            function initMenu() {
                const menuToggle = document.getElementById('menu-toggle');
                const sideMenu = document.getElementById('side-menu');
                const menuOverlay = document.getElementById('menu-overlay');
                
                if (!menuToggle || !sideMenu || !menuOverlay) {
                    console.warn('Menu elements not found');
                    return;
                }
                
                // Prevent multiple initializations
                if (menuToggle.dataset.initialized === 'true') {
                    return;
                }
                menuToggle.dataset.initialized = 'true';
                
                function openMenu() {
                    sideMenu.classList.add('open');
                    menuOverlay.classList.add('active');
                    menuToggle.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
                
                function closeMenu() {
                    sideMenu.classList.remove('open');
                    menuOverlay.classList.remove('active');
                    menuToggle.classList.remove('active');
                    document.body.style.overflow = '';
                }
                
                function toggleMenu() {
                    if (sideMenu.classList.contains('open')) {
                        closeMenu();
                    } else {
                        openMenu();
                    }
                }
                
                // Toggle menu on hamburger click
                menuToggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    toggleMenu();
                });
                
                // Close menu on overlay click
                menuOverlay.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    closeMenu();
                });
                
                // Close menu when clicking on menu items
                const menuItems = document.querySelectorAll('.side-menu-item');
                menuItems.forEach(item => {
                    item.addEventListener('click', function(e) {
                        // Allow navigation first, then close menu
                        setTimeout(closeMenu, 100);
                    });
                });
                
                // Close menu on Escape key
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && sideMenu.classList.contains('open')) {
                        closeMenu();
                    }
                });
            }
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initMenu);
            } else {
                initMenu();
            }
            
            // Load rewards data
            if (typeof loadRewardsData === 'function') {
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', loadRewardsData);
                } else {
                    loadRewardsData();
                }
            }
        })();
    </script>
    <script src="script.js"></script>
</body>
</html>
