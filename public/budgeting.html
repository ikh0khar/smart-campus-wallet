<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgeting and Spending - RU Stable</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Inter:wght@400&family=Inria+Sans:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="menu-icon" id="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="logo-container">
                <a href="/" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit;">
                    <img alt="RU Stable Logo" class="logo-img" src="/assets/logo.png" />
                    <p class="logo-text">
                        <span class="logo-red">RU</span><span> Stable</span>
                    </p>
                </a>
            </div>
            <div class="menu-icon" style="visibility: hidden;">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>

        <!-- Side Menu -->
        <div class="side-menu" id="side-menu">
            <div class="side-menu-content">
                <a href="/" class="side-menu-item">
                    <span>Home</span>
                </a>
                <a href="/budgeting.html" class="side-menu-item">
                    <span>Budget and spending</span>
                </a>
                <a href="/activity.html" class="side-menu-item">
                    <span>My activity</span>
                </a>
                <a href="/rewards.html" class="side-menu-item">
                    <span>Rewards and incentives</span>
                </a>
            </div>
        </div>
        <div class="menu-overlay" id="menu-overlay"></div>

        <!-- Budgeting Section -->
        <section class="content-section">
            <h2 class="section-title">Budgeting and Spending</h2>
            
            <!-- Add Transaction Form -->
            <div class="add-transaction-section">
                <button class="toggle-form-btn" id="toggle-form-btn" onclick="toggleAddTransactionForm()">
                    <span>+</span> Add New Transaction
                </button>
                <div class="transaction-form-container" id="transaction-form-container" style="display: none;">
                    <h3 class="form-title">Add Transaction</h3>
                    <form id="add-transaction-form" class="transaction-form" onsubmit="handleAddTransaction(event)">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="tx-merchant">Merchant/Store *</label>
                                <input type="text" id="tx-merchant" name="merchant" required placeholder="e.g., Starbucks">
                            </div>
                            <div class="form-group">
                                <label for="tx-amount">Amount ($) *</label>
                                <input type="number" id="tx-amount" name="amount" required min="0" step="0.01" placeholder="0.00">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="tx-category">Category *</label>
                                <select id="tx-category" name="category" required>
                                    <option value="">Select category</option>
                                    <option value="food">Food</option>
                                    <option value="transportation">Transportation</option>
                                    <option value="books">Books</option>
                                    <option value="entertainment">Entertainment</option>
                                    <option value="utilities">Utilities</option>
                                    <option value="supplies">Supplies</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="tx-payment-method">Payment Method *</label>
                                <select id="tx-payment-method" name="paymentMethod" required>
                                    <option value="">Select method</option>
                                    <option value="Dining Dollars">Dining Dollars</option>
                                    <option value="RUID">RUID</option>
                                    <option value="Credit Card">Credit Card</option>
                                    <option value="Debit Card">Debit Card</option>
                                    <option value="Cash">Cash</option>
                                    <option value="Venmo">Venmo</option>
                                    <option value="PayPal">PayPal</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="tx-location">Location (Optional)</label>
                                <input type="text" id="tx-location" name="location" placeholder="e.g., Campus Center">
                            </div>
                            <div class="form-group">
                                <label for="tx-date">Date *</label>
                                <input type="date" id="tx-date" name="date" required>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="button" class="btn-cancel" onclick="toggleAddTransactionForm()">Cancel</button>
                            <button type="submit" class="btn-submit">Add Transaction</button>
                        </div>
                        
                        <div id="form-message" class="form-message"></div>
                    </form>
                </div>
            </div>
            
            <div id="budgeting-content" class="section-content">
                <div class="loading">Loading budgeting data...</div>
            </div>
        </section>
    </div>
    <script>
        // Menu toggle functionality - ensure it works properly
        (function() {
            function initMenu() {
                const menuToggle = document.getElementById('menu-toggle');
                const sideMenu = document.getElementById('side-menu');
                const menuOverlay = document.getElementById('menu-overlay');
                
                if (!menuToggle || !sideMenu || !menuOverlay) {
                    console.warn('Menu elements not found');
                    return;
                }
                
                // Prevent multiple initializations
                if (menuToggle.dataset.initialized === 'true') {
                    return;
                }
                menuToggle.dataset.initialized = 'true';
                
                function openMenu() {
                    sideMenu.classList.add('open');
                    menuOverlay.classList.add('active');
                    menuToggle.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
                
                function closeMenu() {
                    sideMenu.classList.remove('open');
                    menuOverlay.classList.remove('active');
                    menuToggle.classList.remove('active');
                    document.body.style.overflow = '';
                }
                
                function toggleMenu() {
                    if (sideMenu.classList.contains('open')) {
                        closeMenu();
                    } else {
                        openMenu();
                    }
                }
                
                // Toggle menu on hamburger click
                menuToggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    toggleMenu();
                });
                
                // Close menu on overlay click
                menuOverlay.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    closeMenu();
                });
                
                // Close menu when clicking on menu items
                const menuItems = document.querySelectorAll('.side-menu-item');
                menuItems.forEach(item => {
                    item.addEventListener('click', function(e) {
                        // Allow navigation first, then close menu
                        setTimeout(closeMenu, 100);
                    });
                });
                
                // Close menu on Escape key
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && sideMenu.classList.contains('open')) {
                        closeMenu();
                    }
                });
            }
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initMenu);
            } else {
                initMenu();
            }
            
            // Load budgeting data
            if (typeof loadBudgetingData === 'function') {
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', loadBudgetingData);
                } else {
                    loadBudgetingData();
                }
            }
        })();
    </script>
    <script src="script.js"></script>
</body>
</html>
