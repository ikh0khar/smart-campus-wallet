[build]
  # Publish directory - Netlify will serve files from the public folder
  publish = "public"
  # Build command (optional - we don't need a build step for static files)
  command = ""

# SPA redirect rules - redirect all non-file routes to index.html
# This handles client-side routing for the frontend
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  # Only redirect if not a file request
  force = false

# Handle specific HTML pages directly
[[redirects]]
  from = "/budgeting"
  to = "/budgeting.html"
  status = 200

[[redirects]]
  from = "/activity"
  to = "/activity.html"
  status = 200

[[redirects]]
  from = "/rewards"
  to = "/rewards.html"
  status = 200

# Environment variables (set these in Netlify dashboard under Site settings > Environment variables)
# API_BACKEND_URL = "https://your-backend-url.railway.app/api"

